name: Update Stock Data

on:
  schedule:
    # 06:00 Thailand time, Monday-Friday
    # GitHub Actions cron uses UTC.
    # Thailand is UTC+7, so 06:00 ICT = 23:00 UTC previous day.
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance ta

      - name: Install Node dependencies
        run: npm ci

      - name: Update stock prices
        run: python scripts/update_prices.py

      - name: Validate data
        run: npm run test:data

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/data/prices.json public/data/scores.json
          git commit -m "Update stock data" || echo "No changes to commit"
          git push