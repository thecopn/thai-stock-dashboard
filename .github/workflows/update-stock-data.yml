name: Update Stock Data

on:
  schedule:
    # 06:00 Thailand time, Monday-Friday = 23:00 UTC, Sunday-Thursday.
    # GitHub scheduled workflows use UTC, so this runs before each Thai market day.
    - cron: "0 23 * * 0-4"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Bangkok
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance

      - name: Update stock data
        run: |
          python scripts/update_prices.py

      - name: Validate data
        run: |
          npm ci
          npm run test:data

      - name: Commit updated data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/data/prices.json public/data/scores.json
          git commit -m "Update stock data" || echo "No changes to commit"
          git push
